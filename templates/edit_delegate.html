{% extends 'base.html' %}

{% block title %}Edit Delegate{% endblock %}
{% block page_title %}Edit Delegate{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 0;">
    <h2>Edit {{ user.name }}</h2>
    
    <form method="POST" class="admin-section" style="text-align: left;">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label>Name</label><br>
            <input type="text" name="name" value="{{ user.name }}" required style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
        </div>
        <div style="margin-bottom: 15px;">
            <label>SL No</label><br>
            <input type="text" name="slno" value="{{ user.slno|default:'' }}" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
        </div>
        <div style="margin-bottom: 15px;">
            <label>Church</label><br>
            <input type="text" name="church" value="{{ user.church|default:'' }}" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
        </div>
        <div style="margin-bottom: 15px;">
            <label>Category</label><br>
            <input type="text" name="category" value="{{ user.category|default:'' }}" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
        </div>
        <div style="margin-bottom: 15px;">
            <label>Seat No</label><br>
            <input type="text" name="seat_no" value="{{ user.seat_no|default:'' }}" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
        </div>
        <div style="margin-bottom: 20px;">
            <label>Constituency</label><br>
            <input type="text" name="constituency" value="{{ user.constituency|default:'' }}" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
        </div>
        
        <button type="submit" class="upload-btn">Save Changes</button>
        <a href="/delegates/" style="display: block; text-align: center; margin-top: 15px; color: var(--text-muted); text-decoration: none;">Cancel</a>
    </form>
</div>
{% endblock %}
