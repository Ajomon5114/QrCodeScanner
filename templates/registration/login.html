<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Attendance System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <h2 style="text-align: center; margin-bottom: 20px;">System Login</h2>
        <form method="post" class="admin-section" style="text-align: left;">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <label>Username</label><br>
                <input type="text" name="username" required style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
            </div>
            <div style="margin-bottom: 20px;">
                <label>Password</label><br>
                <input type="password" name="password" required style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
            </div>
            <button type="submit" class="upload-btn">Login</button>
            {% if form.errors %}
            <p style="color: #ef4444; margin-top: 15px; font-size: 0.9rem; text-align: center;">Invalid username or password.</p>
            {% endif %}
        </form>
    </div>
</body>
</html>
